<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The argument principle — Visual Complex Analysis</title>
<meta name="description" content="The image loop winds once per root inside.">
<link rel="stylesheet" href="lib/vca.css">
<script src="lib/vca.js"></script>
</head>
<body>
<script>
const { C, num, row } = VCA;
const P = VCA.page({
  id: "ch07-argument-principle",
  kicker: 'Drag the roots <span class="k1">●</span>, the pole <span class="k5">●</span> and the loop. The image loop winds once round 0 for every root inside.',
  planes: [{ R: 2.5, title: "z-plane" }, { R: 6, title: "w = f(z)" }],
  explain: `
  <h2>Counting roots by watching angles</h2>
  <p>Let <i>f</i>(<i>z</i>) = (<i>z</i> − <i>a</i>₁)(<i>z</i> − <i>a</i>₂)…. As <i>z</i> goes once around a loop, the factor (<i>z</i> − <i>a<sub>k</sub></i>) turns once if <i>a<sub>k</sub></i> is inside the loop and not at all if it is outside. Since angles add under multiplication, arg <i>f</i> turns once for every root inside. So the image loop <i>f</i>(<i>L</i>) winds around 0 exactly <i>N</i> times. A pole contributes a turn in the opposite direction, giving ν = <i>N</i> − <i>P</i>. This is the <b>argument principle</b>.</p>
  <h2>Two consequences</h2>
  <p>Make the loop huge: <i>f</i> behaves like <i>z<sup>n</sup></i>, so the image winds <i>n</i> times. Every root must then be somewhere inside, which proves the <b>fundamental theorem of algebra</b>. And if you perturb <i>f</i> by something smaller than |<i>f</i>| along the loop (the "dog on a leash" of Rouché's theorem), the winding number, and so the root count, cannot change.</p>`,
});
const [zp, wp] = P.planes, ui = P.ui;
const R0 = [{ x: -0.9, y: 0.6 }, { x: 0.7, y: 0.4 }, { x: 0.2, y: -1.1 }, { x: 1.6, y: -1.3 }, { x: -1.7, y: -1.4 }];
R0.forEach((p, i) => zp.handle("r" + i, p, { color: "c1" }));
zp.handle("pole", { x: -0.3, y: -0.3 }, { color: "c5" });
zp.handle("c", { x: 0, y: 0 }, { color: "c3" });
const nR = ui.slider("Roots", 1, 5, 1, 3);
const usePole = ui.check("Include a pole", false);
const rad = ui.slider("Loop radius", 0.2, 2.4, 0.01, 1.3, v => v.toFixed(2));
const probe = ui.check("Moving point", true);
const mv = VCA.anim(() => {});
ui.toggle("Move point", mv);
setTimeout(() => mv.start(), 300);

VCA.run(() => {
  const n = nR.value;
  R0.forEach((_, i) => { zp.handles["r" + i].hidden = i >= n; });
  zp.handles.pole.hidden = !usePole.value;
  const roots = R0.slice(0, n).map((_, i) => zp.get("r" + i)), pole = zp.get("pole"), c = zp.get("c"), r = rad.value;
  const f = z => { let w = C.ONE; for (const a of roots) w = C.mul(w, C.sub(z, a)); return usePole.value ? C.div(w, C.sub(z, pole)) : w; };
  const N = 600, img = [];
  for (let i = 0; i <= N; i++) img.push(f(C.add(c, C.polar(r, VCA.TAU * i / N))));
  const M = Math.max(...img.map(C.abs).filter(isFinite));
  const R = Math.min(200, Math.max(1, M * 1.15));
  if (Math.abs(R - wp.R) / wp.R > 0.08) wp.setView(R);
  zp.circle(c, r, { color: "c3", width: 2.5, fill: "f3" });
  wp.path(img, { color: "c3", width: 2.2, jump: Infinity });
  wp.dot(C.ZERO, { color: "ink", r: 5 });
  roots.forEach(a => zp.dot(a, { color: "c1", r: 3 }));
  const nu = VCA.winding(img.slice(0, N), C.ZERO);
  const inside = roots.filter(a => C.dist(a, c) < r).length, pin = usePole.value && C.dist(pole, c) < r ? 1 : 0;
  if (probe.value) {
    const t = mv.t * 0.9, z = C.add(c, C.polar(r, t)), w = f(z);
    zp.dot(z, { color: "c2", r: 6 }); wp.dot(w, { color: "c2", r: 6 });
    wp.line(C.ZERO, w, { color: "c2", width: 1.5 });
    roots.forEach(a => zp.line(a, z, { color: "c2", width: 1, opacity: 0.5 }));
  }
  P.read(row("N", "c1", `${inside} root${inside === 1 ? "" : "s"} inside`) + (usePole.value ? row("P", "c5", `${pin} pole inside`) : "") +
    `<hr><div class="big">Winding of f(L) round 0: <b>${nu}</b></div><div class="${nu === inside - pin ? "ok" : "bad"}">N − P = ${inside - pin}</div>`);
});

</script>
</body>
</html>
