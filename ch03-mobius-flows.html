<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Möbius transformations: the four types — Visual Complex Analysis</title>
<meta name="description" content="Elliptic, hyperbolic, loxodromic flows and Steiner circles.">
<link rel="stylesheet" href="lib/vca.css">
<script src="lib/vca.js"></script>
</head>
<body>
<script>
const { C, num, row } = VCA;
const P = VCA.page({
  id: "ch03-mobius-flows",
  kicker: 'Drag the fixed points <span class="k4">ξ₊</span> and <span class="k5">ξ₋</span>. Choose the multiplier to see each type of Möbius map.',
  planes: [{ R: 3, unit: false }],
  explain: `
  <h2>The normal form</h2>
  <p>A Möbius transformation <i>M</i> with two fixed points ξ₊ and ξ₋ can be written as</p>
  <p style="text-align:center"><i>(M(z) − ξ₊)/(M(z) − ξ₋) = k · (z − ξ₊)/(z − ξ₋)</i>.</p>
  <p>The change of variable <i>w</i> = (<i>z</i> − ξ₊)/(<i>z</i> − ξ₋) sends ξ₊ to 0 and ξ₋ to ∞, and turns <i>M</i> into plain multiplication <i>w</i> ↦ <i>kw</i>. So everything depends on the <b>multiplier</b> <i>k</i> = ρ e<sup>iα</sup>.</p>
  <h2>The four types</h2>
  <p><b>Elliptic</b> (ρ = 1): points circle around the fixed points along the Apollonian circles. <b>Hyperbolic</b> (α = 0): points stream from one fixed point to the other along the circles through both. <b>Loxodromic</b> (both): points spiral out of one and into the other. In <i>w</i> these are rotations, dilations and spiral stretches about 0. The two families of circles (the <b>Steiner circles</b>) are drawn faintly. The fourth type, <b>parabolic</b>, is the limit in which the two fixed points merge.</p>
  <p>The small triangle shows the discrete map: the triangle and its images under <i>M</i><sup>±1</sup>, <i>M</i><sup>±2</sup>, … (drag its corner).</p>`,
});
const [pl] = P.planes, ui = P.ui;
pl.handle("p", { x: -1, y: 0 }, { color: "c4", label: "ξ₊" });
pl.handle("m", { x: 1, y: 0 }, { color: "c5", label: "ξ₋" });
pl.handle("s", { x: -0.2, y: 0.9 }, { color: "c3" });
const lr = ui.slider("log ρ", -1.2, 1.2, 0.01, 0.5, v => v.toFixed(2));
const al = ui.slider("α", -3.14, 3.14, 0.01, 0.6, v => VCA.deg(v, 0));
ui.buttons([["Elliptic", () => { lr.value = 0; al.value = 0.7; }], ["Hyperbolic", () => { lr.value = 0.6; al.value = 0; }], ["Loxodromic", () => { lr.value = 0.5; al.value = 0.6; }]]);
const steiner = ui.check("Steiner circles", true);
const iter = ui.check("Iterated triangle", true);
const parts = [];
for (let i = 0; i < 160; i++) parts.push({ s: -3 + 6 * Math.random(), t: VCA.TAU * Math.random() });
const flow = VCA.anim(dt => {
  for (const q of parts) { q.s += lr.value * dt * 0.8; q.t += al.value * dt * 0.8; if (q.s > 3) q.s -= 6; if (q.s < -3) q.s += 6; }
});
ui.toggle("Flow", flow);
setTimeout(() => flow.start(), 300);

VCA.run(() => {
  const a = pl.get("p"), b = pl.get("m");
  const toZ = w => C.div(C.sub(C.mul(w, b), a), C.sub(w, C.ONE));
  const toW = z => C.div(C.sub(z, a), C.sub(z, b));
  const k = C.polar(Math.exp(lr.value), al.value);
  if (steiner.value) {
    for (let i = 0; i < 12; i++) { const th = i * Math.PI / 6; pl.curve(s => toZ(C.polar(Math.exp(s), th)), -6, 6, { color: "c6", width: 1, opacity: 0.55, n: 200 }); }
    for (let s = -2.5; s <= 2.51; s += 0.5) pl.curve(t => toZ(C.polar(Math.exp(s), t)), 0, VCA.TAU, { color: "c2", width: 1, opacity: 0.55, n: 160 });
  }
  for (const q of parts) {
    const tail = [];
    for (let j = 0; j < 6; j++) tail.push(toZ(C.polar(Math.exp(q.s - j * 0.04 * lr.value), q.t - j * 0.04 * al.value)));
    pl.path(tail, { color: "c1", width: 2, opacity: 0.6 });
    pl.dot(tail[0], { color: "c1", r: 2.4 });
  }
  if (iter.value) {
    const s = pl.get("s"), tri = [s, C.add(s, { x: 0.3, y: 0 }), C.add(s, { x: 0, y: 0.18 })].map(toW);
    for (let n = -5; n <= 5; n++) {
      const kn = C.polar(Math.exp(lr.value * n), al.value * n);
      const pts = tri.map(w => toZ(C.mul(kn, w)));
      pl.poly(pts, { color: "c3", fill: n === 0 ? "c3" : "f3", width: 1.3, opacity: n === 0 ? 0.9 : 1 - Math.abs(n) * 0.13 });
    }
  }
  const type = Math.abs(lr.value) < 0.005 ? (Math.abs(al.value) < 0.005 ? "Identity" : "Elliptic") : Math.abs(al.value) < 0.005 ? "Hyperbolic" : "Loxodromic";
  P.read(row("type", "", `<span class="big">${type}</span>`) + row("k", "", `${C.fmt(k)}<br><span class="sub">ρ = ${num(Math.exp(lr.value))}, α = ${VCA.deg(al.value)}</span>`) +
    row("ξ₊", "c4", C.fmt(a)) + row("ξ₋", "c5", C.fmt(b)));
});

</script>
</body>
</html>
